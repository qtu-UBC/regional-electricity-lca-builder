name: Python checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cloud requirements
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m py_compile app.py grid_core.py openlca_jsonld.py provider_library.py extract_provider_library.py instructor_catalog.py mv_market.py extract_mv_adapter.py
